services:
  - type: web
    name: whatsapp-food-bot
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: UV_THREADPOOL_SIZE
        value: 128
    disk:
      name: auth-data
      mountPath: /opt/render/project/src/auth_info_baileys
      sizeGB: 1
    healthCheckPath: /health
    autoDeploy: false